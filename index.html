<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Basketball Digital Playbook</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --court-wood: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  .app-container {
    width: 100%;
    max-width: 960px;
  }

  /* Navigation Bar */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--card-border);
    margin-bottom: 20px;
  }
  .nav-brand {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .back-btn {
    background: #334155;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease;
  }
  .back-btn:hover { background: #475569; }

  /* Dashboard Grid View */
  #dashboard-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .play-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .play-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card-tag {
    align-self: flex-start;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .play-card h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .play-card p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.4;
    margin-bottom: 16px;
  }
  .card-action {
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* Playboard View */
  #play-view {
    display: none;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--card-border);
  }
  .play-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .status-badge {
    background: #334155;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  .canvas-wrapper {
    width: 100%;
    aspect-ratio: 94 / 50;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls-panel {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-row span {
    font-size: 0.85rem;
    font-family: monospace;
    color: var(--text-muted);
    min-width: 45px;
  }
  input[type=range] {
    flex: 1;
    height: 6px;
    accent-color: var(--accent);
    background: #334155;
    border-radius: 3px;
    cursor: pointer;
  }
  .buttons-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button.ctrl-btn {
    background: #334155;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.ctrl-btn:hover { background: #475569; }
  button.option-btn.active {
    background: var(--accent);
    color: #0f172a;
  }
  .legend {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
    font-size: 0.8rem;
    background: #0f172a;
    padding: 12px;
    border-radius: 6px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .badge {
    min-width: 24px;
    height: 24px;
    padding: 0 4px;
    border-radius: 12px;
    color: #fff;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="navbar">
    <div class="nav-brand">
      <span>🏀</span> Crimson Playbook
    </div>
    <button class="back-btn" id="backBtn" style="display: none;" onclick="location.hash=''">
      &larr; Back to Playbook
    </button>
  </div>

  <!-- Main Playbook Menu -->
  <div id="dashboard-view"></div>

  <!-- Interactive Playboard View -->
  <div id="play-view">
    <div class="play-header">
      <h1 id="playTitle" style="font-size: 1.25rem;">Play Name</h1>
      <div class="status-badge" id="phaseText">Phase 1</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="courtCanvas" width="940" height="500"></canvas>
    </div>

    <div class="controls-panel">
      <div class="slider-row">
        <span id="timeDisplay">0.0s</span>
        <input type="range" id="timelineScrubber" min="0" max="1000" value="0">
        <span>5.0s</span>
      </div>

      <div class="buttons-row">
        <div class="btn-group">
          <button class="ctrl-btn" id="playBtn">Play</button>
          <button class="ctrl-btn" id="resetBtn">Reset</button>
          <button class="ctrl-btn" id="speedBtn">Speed: 1x</button>
        </div>
        <div class="btn-group" id="optionsContainer"></div>
      </div>
    </div>

    <div class="legend" id="legendContainer"></div>
  </div>
</div>

<script>
// ==========================================
// 1. PLAY REGISTRY
// ==========================================
const playbook = [
  {
    slug: 'laker-drill',
    category: 'Transition',
    title: '5-on-0 Fast Break (Laker Drill)',
    description: '5-lane transition break attacking the rim, corners, and trailer off a defensive rebound.',
    options: [
      { id: 'A', label: 'Option A: Rim Runner' },
      { id: 'B', label: 'Option B: Corner Kick' },
      { id: 'C', label: 'Option C: Trailer Drop' }
    ],
    legend: [
      { num: '1', color: '#2563eb', desc: 'PG: Middle push' },
      { num: '2', color: '#059669', desc: 'RW: Right sideline/corner' },
      { num: '3', color: '#d97706', desc: 'LW: Left sideline/corner' },
      { num: '4', color: '#7c3aed', desc: 'Trailer: Center slot' },
      { num: '5', color: '#dc2626', desc: 'Rim Runner: Center sprint' }
    ],
    getPositions: function(t, option) {
      let p1, p2, p3, p4, p5, ball;

      if (t < 0.2) p5 = { x: 75, y: 250 };
      else if (t < 0.8) p5 = { x: 75 + ((t - 0.2) / 0.6) * (840 - 75), y: 250 };
      else p5 = { x: 840, y: 250 };

      if (t < 0.15) p1 = { x: 130 + (t / 0.15) * 10, y: 340 };
      else if (t < 0.75) {
        let sub = (t - 0.15) / 0.6;
        p1 = { x: 140 + sub * (680 - 140), y: 340 + sub * (250 - 340) };
      } else p1 = { x: 710, y: 250 };

      if (t < 0.2) p2 = { x: 110, y: 390 };
      else if (t < 0.65) p2 = { x: 110 + ((t - 0.2) / 0.45) * (620 - 110), y: 465 };
      else if (t < 0.85) {
        let sub = (t - 0.65) / 0.2;
        p2 = { x: 620 + sub * (860 - 620), y: 465 - sub * (465 - 440) };
      } else p2 = { x: 860, y: 440 };

      if (t < 0.2) p3 = { x: 110, y: 110 };
      else if (t < 0.65) p3 = { x: 110 + ((t - 0.2) / 0.45) * (620 - 110), y: 35 };
      else if (t < 0.85) {
        let sub = (t - 0.65) / 0.2;
        p3 = { x: 620 + sub * (860 - 620), y: 35 + sub * (60 - 35) };
      } else p3 = { x: 860, y: 60 };

      if (t < 0.3) p4 = { x: 60, y: 180 };
      else if (t < 0.85) {
        let sub = (t - 0.3) / 0.55;
        p4 = { x: 60 + sub * (600 - 60), y: 180 + sub * (250 - 180) };
      } else p4 = { x: 600, y: 250 };

      if (t < 0.1) ball = { x: p5.x, y: p5.y };
      else if (t < 0.2) {
        let sub = (t - 0.1) / 0.1;
        ball = { x: p5.x + sub * (p1.x - p5.x), y: p5.y + sub * (p1.y - p5.y) };
      } else if (t < 0.75) {
        ball = { x: p1.x + 8, y: p1.y + 4 };
      } else {
        let sub = (t - 0.75) / 0.25;
        if (option === 'A') ball = { x: p1.x + sub * (850 - p1.x), y: p1.y + sub * (250 - p1.y) };
        else if (option === 'B') ball = { x: p1.x + sub * (p2.x - p1.x), y: p1.y + sub * (p2.y - p1.y) };
        else ball = { x: p1.x + sub * (p4.x - p1.x), y: p1.y + sub * (p4.y - p1.y) };
      }

      return { p1, p2, p3, p4, p5, ball };
    }
  },
  {
    slug: 'trap-drill',
    category: 'Offense / Press Break',
    title: '3-on-2 Press Trap & Escape Drill',
    description: 'Two defenders (D1, D2) trap the ball handler along the sideline. Offense drills three escape options: splitting the trap, advancing up-line, or reversing cross-court.',
    options: [
      { id: 'A', label: 'Option A: Split the Trap (Drive Through)' },
      { id: 'B', label: 'Option B: Up-Line Release (to #2)' },
      { id: 'C', label: 'Option C: Flash/Reversal (to #3)' }
    ],
    legend: [
      { num: '1', color: '#2563eb', desc: 'Ball Handler: Attacked by trap' },
      { num: '2', color: '#059669', desc: 'Up-Line Wing: Sinks down sideline' },
      { num: '3', color: '#d97706', desc: 'Middle/Weak Wing: Flashes center' },
      { num: 'D', color: '#dc2626', desc: 'Trap Defender 1: On-ball sideline channel' },
      { num: 'D', color: '#b91c1c', desc: 'Trap Defender 2: Help trapper from front' }
    ],
    getPositions: function(t, option) {
      let p1, p2, p3, d1, d2, ball;

      if (t < 0.5) {
        let sub = t / 0.5;
        p1 = { x: 220 + sub * 200, y: 350 + sub * 70 };
      } else if (t < 0.75) {
        p1 = { x: 420, y: 420 };
      } else {
        let sub = (t - 0.75) / 0.25;
        if (option === 'A') p1 = { x: 420 + sub * 220, y: 420 - sub * 80 };
        else p1 = { x: 420, y: 420 };
      }

      if (t < 0.5) {
        let sub = t / 0.5;
        d1 = { x: 250 + sub * 150, y: 320 + sub * 80 };
      } else if (t < 0.75) {
        d1 = { x: 400, y: 400 };
      } else {
        d1 = option === 'A' ? { x: 405, y: 395 } : { x: 400, y: 400 };
      }

      if (t < 0.2) {
        d2 = { x: 460, y: 430 };
      } else if (t < 0.5) {
        let sub = (t - 0.2) / 0.3;
        d2 = { x: 460 - sub * 20, y: 430 };
      } else if (t < 0.75) {
        d2 = { x: 440, y: 430 };
      } else {
        d2 = option === 'A' ? { x: 445, y: 435 } : { x: 440, y: 430 };
      }

      if (t < 0.4) {
        p2 = { x: 620, y: 450 };
      } else if (t < 0.75) {
        let sub = (t - 0.4) / 0.35;
        p2 = { x: 620 - sub * 80, y: 450 };
      } else {
        p2 = { x: 540, y: 450 };
      }

      if (t < 0.35) {
        p3 = { x: 380, y: 160 };
      } else if (t < 0.7) {
        let sub = (t - 0.35) / 0.35;
        p3 = { x: 380 + sub * 60, y: 160 + sub * 100 };
      } else {
        p3 = { x: 440, y: 260 };
      }

      if (t < 0.5) {
        ball = { x: p1.x + 8, y: p1.y + 4 };
      } else if (t < 0.75) {
        ball = { x: 420, y: 420 };
      } else {
        let sub = (t - 0.75) / 0.25;
        if (option === 'A') ball = { x: p1.x + 8, y: p1.y + 4 };
        else if (option === 'B') ball = { x: 420 + sub * (p2.x - 420), y: 420 + sub * (p2.y - 420) };
        else ball = { x: 420 + sub * (p3.x - 420), y: 420 + sub * (p3.y - 420) };
      }

      return { p1, p2, p3, d1, d2, ball };
    }
  },
  {
    slug: 'box-blob',
    category: 'Inbounds / BLOB',
    title: 'Box Baseline Inbounds (vs Defenders)',
    description: 'Four defenders in man coverage. #1 down-screens to pin #4\'s defender, while #4 cross-screens to wall off #5\'s defender for a clean layup.',
    options: [
      { id: 'A', label: 'Option A: Cross-Cut Layup (#5)' },
      { id: 'B', label: 'Option B: Safety Pop (#1)' }
    ],
    legend: [
      { num: '3', color: '#d97706', desc: 'Inbounder: Baseline passer' },
      { num: '1', color: '#2563eb', desc: 'Ball-Side Elbow: Down-screener / Safety pop' },
      { num: '4', color: '#7c3aed', desc: 'Ball-Side Block: Cross-screener for #5' },
      { num: '2', color: '#059669', desc: 'Weak-Side Elbow: Corner flare' },
      { num: '5', color: '#dc2626', desc: 'Weak-Side Block: Cuts off screen to rim' },
      { num: 'D', color: '#64748b', desc: 'Defenders (Man-to-Man coverage)' }
    ],
    getPositions: function(t, option) {
      let p1, p2, p3, p4, p5, ball;
      let d_inbound, d_block1, d_block2, d_elbow1, d_elbow2;

      // Inbounder #3 on baseline (starts at X: 928, Y: 330)
      if (t < 0.8) {
        p3 = { x: 928, y: 330 };
      } else {
        let sub = (t - 0.8) / 0.2;
        p3 = { x: 928 - sub * 48, y: 330 + sub * 20 };
      }

      // Inbound Defender (D): jumps in front of inbounder
      d_inbound = { x: 905, y: 330 };

      // #1 (Ball-Side Elbow - Down Screener)
      if (t < 0.2) {
        p1 = { x: 730, y: 330 };
      } else if (t < 0.5) {
        let sub = (t - 0.2) / 0.3;
        // Sprints down to plant solid down-screen on D_block1
        p1 = { x: 730 + sub * (835 - 730), y: 330 };
      } else if (t < 0.8) {
        let sub = (t - 0.5) / 0.3;
        // Pops out to the 3-point line / safety
        p1 = { x: 835 - sub * (835 - 660), y: 330 - sub * (330 - 250) };
      } else {
        p1 = { x: 660, y: 250 };
      }

      // D_elbow1 (Defender on #1)
      if (t < 0.2) {
        d_elbow1 = { x: 745, y: 320 };
      } else if (t < 0.5) {
        let sub = (t - 0.2) / 0.3;
        // Follows #1 down
        d_elbow1 = { x: 745 + sub * 80, y: 320 };
      } else if (t < 0.8) {
        let sub = (t - 0.5) / 0.3;
        // Recovers late toward #1 at top of key
        d_elbow1 = { x: 825 - sub * (825 - 690), y: 320 - sub * (320 - 255) };
      } else {
        d_elbow1 = { x: 690, y: 255 };
      }

      // #4 (Ball-Side Block - Cross Screener)
      if (t < 0.3) {
        p4 = { x: 870, y: 330 };
      } else if (t < 0.6) {
        let sub = (t - 0.3) / 0.3;
        // Comes off down-screen to set cross-screen on D_block2
        p4 = { x: 870, y: 330 - sub * (330 - 205) };
      } else {
        p4 = { x: 870, y: 205 };
      }

      // D_block1 (Defender on #4 - gets trapped/delayed by #1's down screen)
      if (t < 0.3) {
        d_block1 = { x: 855, y: 330 };
      } else if (t < 0.6) {
        // Pinned by #1's screen! Cannot chase #4
        d_block1 = { x: 850, y: 325 };
      } else {
        d_block1 = { x: 855, y: 300 };
      }

      // #5 (Weak-Side Block - Cutter to Rim)
      if (t < 0.45) {
        p5 = { x: 870, y: 170 };
      } else if (t < 0.75) {
        let sub = (t - 0.45) / 0.3;
        // Cuts tight off #4's cross screen straight to the rim
        p5 = { x: 870, y: 170 + sub * (260 - 170) };
      } else {
        p5 = { x: 870, y: 260 };
      }

      // D_block2 (Defender on #5 - gets walled off by #4's cross screen)
      if (t < 0.45) {
        d_block2 = { x: 855, y: 175 };
      } else if (t < 0.75) {
        // Runs right into #4's chest, walled off from following #5 to the rim!
        d_block2 = { x: 865, y: 195 };
      } else {
        // Trailing hopelessly behind
        d_block2 = { x: 865, y: 205 };
      }

      // #2 (Weak-Side Elbow - Corner Flare)
      if (t < 0.35) {
        p2 = { x: 730, y: 170 };
      } else if (t < 0.7) {
        let sub = (t - 0.35) / 0.35;
        p2 = { x: 730 + sub * (860 - 730), y: 170 - sub * (170 - 70) };
      } else {
        p2 = { x: 860, y: 70 };
      }

      // D_elbow2 (Defender on #2)
      if (t < 0.35) {
        d_elbow2 = { x: 745, y: 175 };
      } else if (t < 0.75) {
        let sub = (t - 0.35) / 0.4;
        d_elbow2 = { x: 745 + sub * (845 - 745), y: 175 - sub * (175 - 85) };
      } else {
        d_elbow2 = { x: 845, y: 85 };
      }

      // Ball Trajectory
      if (t < 0.7) {
        ball = { x: p3.x - 6, y: p3.y };
      } else {
        let sub = (t - 0.7) / 0.3;
        if (option === 'A') {
          // Bounce pass to #5 wide open right at the rim
          ball = { x: 928 - sub * (928 - p5.x), y: 330 - sub * (330 - p5.y) };
        } else {
          // Safety chest pass to #1 popping out to perimeter
          ball = { x: 928 - sub * (928 - p1.x), y: 330 - sub * (330 - p1.y) };
        }
      }

      return { p1, p2, p3, p4, p5, d_inbound, d_block1, d_block2, d_elbow1, d_elbow2, ball };
    }
  }
];

// ==========================================
// 2. ROUTER & VIEW LOGIC
// ==========================================
let currentPlay = null;
let activeOption = 'A';
let isPlaying = false;
let progress = 0;
let playSpeed = 1.0;
let lastTimestamp = null;
const totalDuration = 5.0;

const dashboardView = document.getElementById('dashboard-view');
const playView = document.getElementById('play-view');
const backBtn = document.getElementById('backBtn');
const canvas = document.getElementById('courtCanvas');
const ctx = canvas.getContext('2d');

function handleRoute() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  const play = playbook.find(p => p.slug === hash);

  if (play) {
    dashboardView.style.display = 'none';
    playView.style.display = 'block';
    backBtn.style.display = 'inline-flex';
    loadPlay(play);
  } else {
    isPlaying = false;
    dashboardView.style.display = 'grid';
    playView.style.display = 'none';
    backBtn.style.display = 'none';
    renderDashboard();
  }
}

function renderDashboard() {
  dashboardView.innerHTML = playbook.map(play => `
    <div class="play-card" onclick="location.hash='#/${play.slug}'">
      <div>
        <div class="card-tag">${play.category}</div>
        <h2>${play.title}</h2>
        <p>${play.description}</p>
      </div>
      <div class="card-action">View Play &rarr;</div>
    </div>
  `).join('');
}

function loadPlay(play) {
  currentPlay = play;
  activeOption = play.options[0].id;
  progress = 0;
  isPlaying = false;
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playTitle').textContent = play.title;

  const optContainer = document.getElementById('optionsContainer');
  optContainer.innerHTML = play.options.map(opt => `
    <button class="ctrl-btn option-btn ${opt.id === activeOption ? 'active' : ''}" data-opt="${opt.id}">
      ${opt.label}
    </button>
  `).join('');

  optContainer.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      optContainer.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeOption = btn.dataset.opt;
      renderFrame();
    });
  });

  const legendContainer = document.getElementById('legendContainer');
  legendContainer.innerHTML = play.legend.map(item => `
    <div class="legend-item">
      <span class="badge" style="background:${item.color}">${item.num}</span>
      <span>${item.desc}</span>
    </div>
  `).join('');

  renderFrame();
}

// ==========================================
// 3. CANVAS DRAWING ROUTINES
// ==========================================
function drawCourt() {
  ctx.fillStyle = '#d97706';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(20, 20, 900, 460);

  ctx.beginPath();
  ctx.moveTo(470, 20); ctx.lineTo(470, 480);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(470, 250, 60, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#b45309';
  ctx.fillRect(20, 170, 190, 160);
  ctx.strokeRect(20, 170, 190, 160);
  ctx.fillRect(730, 170, 190, 160);
  ctx.strokeRect(730, 170, 190, 160);

  ctx.beginPath();
  ctx.arc(50, 250, 220, -Math.PI / 2.3, Math.PI / 2.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(890, 250, 220, Math.PI - Math.PI / 2.3, Math.PI + Math.PI / 2.3);
  ctx.stroke();

  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(45, 225); ctx.lineTo(45, 275);
  ctx.moveTo(895, 225); ctx.lineTo(895, 275);
  ctx.stroke();

  ctx.strokeStyle = '#ea580c';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(55, 250, 9, 0, Math.PI * 2);
  ctx.arc(885, 250, 9, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPlayer(x, y, label, color) {
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
}

function drawBall(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#ea580c';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000';
  ctx.stroke();
}

function renderFrame() {
  if (!currentPlay) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCourt();

  const pos = currentPlay.getPositions(progress, activeOption);

  if (currentPlay.slug === 'box-blob') {
    // 5 Defenders in Man-to-Man (D)
    drawPlayer(pos.d_inbound.x, pos.d_inbound.y, 'D', '#64748b');
    drawPlayer(pos.d_block1.x, pos.d_block1.y, 'D', '#64748b');
    drawPlayer(pos.d_block2.x, pos.d_block2.y, 'D', '#64748b');
    drawPlayer(pos.d_elbow1.x, pos.d_elbow1.y, 'D', '#64748b');
    drawPlayer(pos.d_elbow2.x, pos.d_elbow2.y, 'D', '#64748b');

    // 5 Offensive Players
    drawPlayer(pos.p3.x, pos.p3.y, '3', '#d97706'); // Inbounder
    drawPlayer(pos.p1.x, pos.p1.y, '1', '#2563eb');
    drawPlayer(pos.p4.x, pos.p4.y, '4', '#7c3aed');
    drawPlayer(pos.p2.x, pos.p2.y, '2', '#059669');
    drawPlayer(pos.p5.x, pos.p5.y, '5', '#dc2626');
  } else if (currentPlay.slug === 'trap-drill') {
    drawPlayer(pos.p1.x, pos.p1.y, '1', '#2563eb');
    drawPlayer(pos.p2.x, pos.p2.y, '2', '#059669');
    drawPlayer(pos.p3.x, pos.p3.y, '3', '#d97706');
    drawPlayer(pos.d1.x, pos.d1.y, 'D', '#dc2626');
    drawPlayer(pos.d2.x, pos.d2.y, 'D', '#b91c1c');
  } else {
    drawPlayer(pos.p5.x, pos.p5.y, '5', '#dc2626');
    drawPlayer(pos.p4.x, pos.p4.y, '4', '#7c3aed');
    drawPlayer(pos.p3.x, pos.p3.y, '3', '#d97706');
    drawPlayer(pos.p2.x, pos.p2.y, '2', '#059669');
    drawPlayer(pos.p1.x, pos.p1.y, '1', '#2563eb');
  }

  drawBall(pos.ball.x, pos.ball.y);

  document.getElementById('timelineScrubber').value = Math.floor(progress * 1000);
  document.getElementById('timeDisplay').textContent = (progress * totalDuration).toFixed(1) + 's';

  const phaseLabel = document.getElementById('phaseText');
  if (currentPlay.slug === 'box-blob') {
    if (progress < 0.3) phaseLabel.textContent = 'Phase 1: Box Setup in Man Defense & Ball Slap';
    else if (progress < 0.55) phaseLabel.textContent = 'Phase 2: #1 Down-Screens D_block1; #4 Cross-Screens D_block2';
    else if (progress < 0.75) phaseLabel.textContent = 'Phase 3: Defender Walled Off! #5 Slips Free to Rim; #1 Pops';
    else {
      if (activeOption === 'A') phaseLabel.textContent = 'Phase 4: Bounce Pass to #5 for Layup';
      else phaseLabel.textContent = 'Phase 4: Safety Pass to #1 at 3-Point Line';
    }
  } else if (currentPlay.slug === 'trap-drill') {
    if (progress < 0.5) phaseLabel.textContent = 'Phase 1: Defenders Steer #1 Toward Sideline';
    else if (progress < 0.75) phaseLabel.textContent = 'Phase 2: Sideline Trap Locked; #2 & #3 Flash to Windows';
    else {
      if (activeOption === 'A') phaseLabel.textContent = 'Phase 3: #1 Splits Between Defenders Downhill';
      else if (activeOption === 'B') phaseLabel.textContent = 'Phase 3: Up-Line Pass to #2';
      else phaseLabel.textContent = 'Phase 3: Reversal Pass to #3 Flashing Center';
    }
  } else {
    if (progress < 0.2) phaseLabel.textContent = 'Phase 1: Rebound & Right Sideline Outlet';
    else if (progress < 0.75) phaseLabel.textContent = 'Phase 2: Sprint Lanes (2 & 3 Hug Sidelines)';
    else {
      if (activeOption === 'A') phaseLabel.textContent = 'Phase 3: Lead Pass to Rim Runner (#5 Layup)';
      else if (activeOption === 'B') phaseLabel.textContent = 'Phase 3: Corner Kick to #2';
      else phaseLabel.textContent = 'Phase 3: Drop Pass to Trailer (#4)';
    }
  }
}

function loop(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;

  if (isPlaying) {
    progress += (delta * playSpeed) / totalDuration;
    if (progress >= 1.0) {
      progress = 1.0;
      isPlaying = false;
      document.getElementById('playBtn').textContent = 'Play';
    }
  }

  renderFrame();
  requestAnimationFrame(loop);
}

// ==========================================
// 4. CONTROLS SETUP
// ==========================================
document.getElementById('playBtn').addEventListener('click', () => {
  if (progress >= 1.0) progress = 0;
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? 'Pause' : 'Play';
  lastTimestamp = null;
});

document.getElementById('resetBtn').addEventListener('click', () => {
  isPlaying = false;
  document.getElementById('playBtn').textContent = 'Play';
  progress = 0;
  renderFrame();
});

const speedBtn = document.getElementById('speedBtn');
speedBtn.addEventListener('click', (e) => {
  playSpeed = playSpeed === 1.0 ? 1.5 : (playSpeed === 1.5 ? 0.5 : 1.0);
  e.target.textContent = `Speed: ${playSpeed}x`;
});

document.getElementById('timelineScrubber').addEventListener('input', (e) => {
  progress = e.target.value / 1000;
  renderFrame();
});

window.addEventListener('hashchange', handleRoute);
window.addEventListener('DOMContentLoaded', () => {
  handleRoute();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
