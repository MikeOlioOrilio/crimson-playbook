<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5-on-0 Fast Break Whiteboard Simulator</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --court-wood: #d97706;
    --court-border: #b45309;
    --lane-paint: #9a3412;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 900px;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
  }
  header {
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
  .status-badge {
    background: #334155;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  .canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 94 / 50;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls-panel {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-row span {
    font-size: 0.85rem;
    font-family: monospace;
    color: var(--text-muted);
    min-width: 48px;
  }
  input[type=range] {
    flex: 1;
    height: 6px;
    accent-color: var(--accent);
    background: #334155;
    border-radius: 3px;
    cursor: pointer;
  }
  .buttons-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    background: #334155;
    color: var(--text-main);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover { background: #475569; }
  button.active {
    background: var(--accent);
    color: #0f172a;
  }
  .legend {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    font-size: 0.8rem;
    background: #0f172a;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #334155;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    color: #fff;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>5-on-0 Fast Break Transition</h1>
    <div class="status-badge" id="phaseText">Phase: Defensive Rebound & Outlet</div>
  </header>

  <div class="canvas-wrapper">
    <canvas id="courtCanvas" width="940" height="500"></canvas>
  </div>

  <div class="controls-panel">
    <div class="slider-row">
      <span id="timeDisplay">0.0s</span>
      <input type="range" id="timelineScrubber" min="0" max="1000" value="0">
      <span>5.0s</span>
    </div>

    <div class="buttons-row">
      <div class="btn-group">
        <button id="playBtn">Play</button>
        <button id="resetBtn">Reset</button>
        <button id="speedBtn">Speed: 1x</button>
      </div>

      <div class="btn-group">
        <button class="option-btn active" data-option="A">Option A: Rim Runner</button>
        <button class="option-btn" data-option="B">Option B: Corner Kick (to #2)</button>
        <button class="option-btn" data-option="C">Option C: Trailer Drop</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="badge" style="background:#2563eb;">1</span> <strong>PG:</strong> Middle push / Nail attack</div>
    <div class="legend-item"><span class="badge" style="background:#059669;">2</span> <strong>RW:</strong> Right sideline (bottom) to corner</div>
    <div class="legend-item"><span class="badge" style="background:#d97706;">3</span> <strong>LW:</strong> Left sideline (top) to corner</div>
    <div class="legend-item"><span class="badge" style="background:#7c3aed;">4</span> <strong>Trailer:</strong> Follows middle behind 1</div>
    <div class="legend-item"><span class="badge" style="background:#dc2626;">5</span> <strong>Rim Runner:</strong> Outlet & center sprint</div>
  </div>
</div>

<script>
const canvas = document.getElementById('courtCanvas');
const ctx = canvas.getContext('2d');

const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const speedBtn = document.getElementById('speedBtn');
const scrubber = document.getElementById('timelineScrubber');
const timeDisplay = document.getElementById('timeDisplay');
const phaseText = document.getElementById('phaseText');
const optionBtns = document.querySelectorAll('.option-btn');

let activeOption = 'A';
let isPlaying = false;
let progress = 0; // 0.0 to 1.0
let playSpeed = 1.0;
let lastTimestamp = null;
const totalDuration = 5.0; // 5 seconds per trip

const colors = {
  P1: '#2563eb', // Point Guard
  P2: '#059669', // Right Wing (Offense Right / Screen Bottom)
  P3: '#d97706', // Left Wing (Offense Left / Screen Top)
  P4: '#7c3aed', // Trailer
  P5: '#dc2626', // Center / Rim Runner
  ball: '#ea580c'
};

// 940 x 500 Court Dimensions
// Left basket is Defensive (X: 50, Y: 250). Right basket is Offensive (X: 890, Y: 250).
// Offense perspective attacking left-to-right:
// - TOP of screen (Y ≈ 35) is LEFT side of attack (#3)
// - BOTTOM of screen (Y ≈ 465) is RIGHT side of attack (#2)
function getPositions(t, option) {
  let p1, p2, p3, p4, p5, ball;

  // #5 (Center / Rebounder -> Rim Runner down exact center line)
  if (t < 0.2) {
    p5 = { x: 75, y: 250 };
  } else if (t < 0.8) {
    let subT = (t - 0.2) / 0.6;
    p5 = { x: 75 + subT * (840 - 75), y: 250 };
  } else {
    p5 = { x: 840, y: 250 };
  }

  // #1 (Point Guard / Ball Handler - flashes right for outlet, pushes middle)
  if (t < 0.15) {
    let subT = t / 0.15;
    p1 = { x: 130 + subT * 10, y: 340 }; // flashes toward right sideline
  } else if (t < 0.75) {
    let subT = (t - 0.15) / 0.6;
    // Pushes up into the middle channel
    p1 = { x: 140 + subT * (680 - 140), y: 340 + subT * (250 - 340) };
  } else {
    // Settles at the nail / foul line (X: 710, Y: 250)
    p1 = { x: 710, y: 250 };
  }

  // #2 (Right Wing - Bottom Sideline: Offense's RIGHT side)
  if (t < 0.2) {
    p2 = { x: 110, y: 390 };
  } else if (t < 0.65) {
    let subT = (t - 0.2) / 0.45;
    // Sprints along the bottom sideline
    p2 = { x: 110 + subT * (620 - 110), y: 465 };
  } else if (t < 0.85) {
    let subT = (t - 0.65) / 0.2;
    // Cuts down into right deep corner
    p2 = { x: 620 + subT * (860 - 620), y: 465 - subT * (465 - 440) };
  } else {
    p2 = { x: 860, y: 440 };
  }

  // #3 (Left Wing - Top Sideline: Offense's LEFT side)
  if (t < 0.2) {
    p3 = { x: 110, y: 110 };
  } else if (t < 0.65) {
    let subT = (t - 0.2) / 0.45;
    // Sprints along the top sideline
    p3 = { x: 110 + subT * (620 - 110), y: 35 };
  } else if (t < 0.85) {
    let subT = (t - 0.65) / 0.2;
    // Cuts down into left deep corner
    p3 = { x: 620 + subT * (860 - 620), y: 35 + subT * (60 - 35) };
  } else {
    p3 = { x: 860, y: 60 };
  }

  // #4 (Trailer - follows 15 feet behind #1 down the middle)
  if (t < 0.3) {
    p4 = { x: 60, y: 180 };
  } else if (t < 0.85) {
    let subT = (t - 0.3) / 0.55;
    p4 = { x: 60 + subT * (600 - 60), y: 180 + subT * (250 - 180) };
  } else {
    p4 = { x: 600, y: 250 };
  }

  // Ball Location & Trajectory
  if (t < 0.1) {
    ball = { x: p5.x, y: p5.y };
  } else if (t < 0.2) {
    // Outlet pass from #5 to #1
    let subT = (t - 0.1) / 0.1;
    ball = { x: p5.x + subT * (p1.x - p5.x), y: p5.y + subT * (p1.y - p5.y) };
  } else if (t < 0.75) {
    // #1 dribbles the ball
    ball = { x: p1.x + 8, y: p1.y + 4 };
  } else {
    let subT = (t - 0.75) / 0.25;
    if (option === 'A') {
      // Option A: Lead pass over the top to Rim Runner (#5 Layup)
      ball = { x: p1.x + subT * (850 - p1.x), y: p1.y + subT * (250 - p1.y) };
    } else if (option === 'B') {
      // Option B: Kick pass to #2 in the right corner
      ball = { x: p1.x + subT * (p2.x - p1.x), y: p1.y + subT * (p2.y - p1.y) };
    } else {
      // Option C: Drop pass back to #4 Trailer at top of the key
      ball = { x: p1.x + subT * (p4.x - p1.x), y: p1.y + subT * (p4.y - p1.y) };
    }
  }

  return { p1, p2, p3, p4, p5, ball };
}

function drawCourt() {
  // Hardwood floor
  ctx.fillStyle = '#d97706';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Border & Midcourt lines
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(20, 20, 900, 460);

  // Center Line & Circle
  ctx.beginPath();
  ctx.moveTo(470, 20);
  ctx.lineTo(470, 480);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(470, 250, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Keys / Paint
  // Left Key (Defensive End)
  ctx.fillStyle = '#b45309';
  ctx.fillRect(20, 170, 190, 160);
  ctx.strokeRect(20, 170, 190, 160);
  ctx.beginPath();
  ctx.arc(210, 250, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Right Key (Offensive End)
  ctx.fillRect(730, 170, 190, 160);
  ctx.strokeRect(730, 170, 190, 160);
  ctx.beginPath();
  ctx.arc(730, 250, 60, 0, Math.PI * 2);
  ctx.stroke();

  // 3-Point Arcs
  ctx.beginPath();
  ctx.arc(50, 250, 220, -Math.PI / 2.3, Math.PI / 2.3);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(890, 250, 220, Math.PI - Math.PI / 2.3, Math.PI + Math.PI / 2.3);
  ctx.stroke();

  // Backboards & Rims
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(45, 225); ctx.lineTo(45, 275);
  ctx.moveTo(895, 225); ctx.lineTo(895, 275);
  ctx.stroke();

  ctx.strokeStyle = '#ea580c';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(55, 250, 9, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(885, 250, 9, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPlayer(x, y, label, color) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;

  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
}

function drawBall(x, y) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fillStyle = colors.ball;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCourt();

  const pos = getPositions(progress, activeOption);

  // Draw Players
  drawPlayer(pos.p5.x, pos.p5.y, '5', colors.P5);
  drawPlayer(pos.p4.x, pos.p4.y, '4', colors.P4);
  drawPlayer(pos.p3.x, pos.p3.y, '3', colors.P3);
  drawPlayer(pos.p2.x, pos.p2.y, '2', colors.P2);
  drawPlayer(pos.p1.x, pos.p1.y, '1', colors.P1);

  // Draw Ball
  drawBall(pos.ball.x, pos.ball.y);

  // Update Controls & Labels
  scrubber.value = Math.floor(progress * 1000);
  timeDisplay.textContent = (progress * totalDuration).toFixed(1) + 's';

  if (progress < 0.2) {
    phaseText.textContent = "Phase 1: Rebound & Immediate Right Sideline Outlet";
  } else if (progress < 0.75) {
    phaseText.textContent = "Phase 2: Sprint Lanes (2 Right, 3 Left Hug Sidelines, 5 Runs Rim)";
  } else {
    if (activeOption === 'A') phaseText.textContent = "Phase 3: Lead Pass to Rim Runner (#5 Layup)";
    else if (activeOption === 'B') phaseText.textContent = "Phase 3: Nail Attack & Corner Kick to #2 (Right Corner)";
    else phaseText.textContent = "Phase 3: Drop Pass to Trailer (#4 at Top of Key)";
  }
}

function animate(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;

  if (isPlaying) {
    progress += (delta * playSpeed) / totalDuration;
    if (progress >= 1.0) {
      progress = 1.0;
      isPlaying = false;
      playBtn.textContent = 'Play';
    }
  }

  render();
  requestAnimationFrame(animate);
}

// User Controls
playBtn.addEventListener('click', () => {
  if (progress >= 1.0) progress = 0;
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  lastTimestamp = null;
});

resetBtn.addEventListener('click', () => {
  isPlaying = false;
  playBtn.textContent = 'Play';
  progress = 0;
  render();
});

speedBtn.addEventListener('click', () => {
  if (playSpeed === 1.0) {
    playSpeed = 1.5;
    speedBtn.textContent = 'Speed: 1.5x';
  } else if (playSpeed === 1.5) {
    playSpeed = 0.5;
    speedBtn.textContent = 'Speed: 0.5x';
  } else {
    playSpeed = 1.0;
    speedBtn.textContent = 'Speed: 1x';
  }
});

scrubber.addEventListener('input', (e) => {
  progress = e.target.value / 1000;
  render();
});

optionBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    optionBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeOption = btn.dataset.option;
    render();
  });
});

// Initial Render
render();
requestAnimationFrame(animate);
</script>
</body>
</html>
